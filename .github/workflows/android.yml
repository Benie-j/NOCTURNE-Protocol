name: Build NOCTURNE Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Install required system tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl unzip ca-certificates
          command -v curl
          command -v unzip
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_VERSION="4.4.1.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz
          unzip -q -o /tmp/godot-templates.tpz -d /tmp/godot-templates
          test -f /tmp/godot-templates/templates/android_debug.apk
          test -f /tmp/godot-templates/templates/android_release.apk
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          echo "Godot Android templates installed:"
          ls -lh "$TEMPLATE_DIR"/android_*.apk

      - name: Configure Android SDK, Java and debug signing
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"
          test -x "$ANDROID_HOME/platform-tools/adb"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NOCTURNE-debug.apk
          test -s build/NOCTURNE-debug.apk
          ls -lh build/NOCTURNE-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOCTURNE-Android-debug
          path: build/NOCTURNE-debug.apk
          if-no-files-found: error
          retention-days: 14
